services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: fulfillflow
      MYSQL_USER: fulfillflow
      MYSQL_PASSWORD: fulfillflow
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
  app:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/fulfillflow?serverTimezone=UTC
      RABBIT_HOST: rabbitmq
    ports: ["8080:8080"]
    volumes: ["./manifests:/manifests"]
    depends_on: [mysql, rabbitmq]
